<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ação Verde - Cadastro</title>
</head>
<body>
    <header>
        <h1>Cadastro de Voluntário - Ação Verde</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos Sociais</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Formulário de Inscrição</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required><br><br>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" required><br><br>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required><br><br>

                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required><br><br>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required><br><br>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" placeholder="00000-000" required><br><br>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required><br><br>

                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado" maxlength="2" placeholder="SP" required><br><br>
                </fieldset>

                <fieldset>
                    <legend>Preferências</legend>
                    <label for="area">Área de Interesse:</label>
                    <select id="area" name="area">
                        <option value="reflorestamento">Reflorestamento</option>
                        <option value="educacao">Educação Ambiental</option>
                        <option value="reciclagem">Reciclagem</option>
                    </select><br><br>

                    <label>Disponibilidade:</label><br>
                    <input type="radio" id="semanal" name="disponibilidade" value="semanal">
                    <label for="semanal">Semanal</label>
                    <input type="radio" id="mensal" name="disponibilidade" value="mensal">
                    <label for="mensal">Mensal</label><br><br>
                </fieldset>

                <input type="submit" value="Enviar Cadastro">
                <input type="reset" value="Limpar">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Ação Verde - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
